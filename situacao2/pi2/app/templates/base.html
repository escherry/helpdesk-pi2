<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Desk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a href="{{ url_for('chamados.index') }}"><h1>Help Desk</h1></a>
<a class="btn" href="{{ url_for('chamados.novo') }}">+ Novo chamado</a></header>
<main>{% for cat, msg in get_flashed_messages(with_categories=true) %}
<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
